name: Validate inventory changes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run test:database
      - run: npm run build
      - name: Package Worker without deploying
        run: npx --no-install wrangler deploy --dry-run --outdir dist/worker
      - run: git diff --check
