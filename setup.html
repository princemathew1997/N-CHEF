<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>N-CHEF administrator setup</title><link rel="stylesheet" href="css/styles.css"></head>
<body style="display:grid;place-items:center;min-height:100vh;padding:24px">
<main class="panel setup-panel" style="max-width:480px;padding:32px;width:100%">
<h1>Set up N-CHEF</h1><p>Create the first administrator for the shared database. This setup works once.</p>
<form id="setupForm">
<label>Setup key<input id="setupKey" type="password" required autocomplete="off"></label>
<label>Full name<input id="setupName" required maxlength="200" autocomplete="name"></label>
<label>Username<input id="setupUsername" required value="admin" pattern="[a-zA-Z0-9_.\-]{3,64}" autocomplete="username"></label>
<label>Password (12–128 characters)<input id="setupPassword" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label>
<button class="btn btn-primary" type="submit">Create administrator</button>
</form><p id="setupMessage" role="status"></p><a href="/">Return to sign in</a>
</main><script src="js/setup.js"></script></body></html>
